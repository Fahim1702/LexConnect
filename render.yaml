services:
  - type: web
    name: lexconnect-bd-api
    runtime: node
    # Keep the workspace package.json and package-lock.json available.
    buildCommand: npm ci --workspace server --omit=dev
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: DNS_SERVERS
        value: system
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: CLIENT_URL
        sync: false
